# Compila el dimensionador para Windows (.exe), macOS (.app) y Linux en cada etiqueta v*
# o manualmente desde la pestaña Actions. Los ejecutables quedan como artefactos descargables.
name: Compilar ejecutables
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Compilar
        run: python -m PyInstaller --noconfirm dimensionador.spec
      - name: Verificar ejecutable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/N25-Valves-Sizing.app/Contents/MacOS/N25-Valves-Sizing;
          elif [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/N25-Valves-Sizing/N25-Valves-Sizing.exe;
          else EXE=dist/N25-Valves-Sizing/N25-Valves-Sizing; fi
          find dist -path "*plugins/platforms*" -type f
          $EXE --prueba
          # Abre la ventana real (complemento de plataforma de Qt) y la cierra sola
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 >/dev/null; xvfb-run -a $EXE --prueba-gui;
          else $EXE --prueba-gui; fi
          echo "Ventana abierta y cerrada correctamente"
      - uses: actions/upload-artifact@v4
        with:
          name: N25-Valves-Sizing-${{ runner.os }}
          path: dist/
      - name: Compilar el generador de códigos (uso interno, solo Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --distpath dist_generador generador.spec
          dist_generador/Generador-codigos-N25/Generador-codigos-N25.exe --prueba-gui
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Generador-codigos-N25-Windows
          path: dist_generador/
