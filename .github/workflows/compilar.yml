# Compila el dimensionador para Windows (.exe), macOS (.app) y Linux en cada etiqueta v*
# o manualmente desde la pestaña Actions. Los ejecutables quedan como artefactos descargables.
name: Compilar ejecutables
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  compilar:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Compilar
        run: python -m PyInstaller --noconfirm dimensionador.spec
      - name: Verificar ejecutable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/Dimensionador.app/Contents/MacOS/Dimensionador;
          elif [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/Dimensionador/Dimensionador.exe;
          else EXE=dist/Dimensionador/Dimensionador; fi
          find dist -path "*plugins/platforms*" -type f
          $EXE --prueba
          # Abre la ventana real (complemento de plataforma de Qt) y la cierra sola
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y xvfb libxcb-cursor0 >/dev/null; xvfb-run -a $EXE --prueba-gui;
          else $EXE --prueba-gui; fi
          echo "Ventana abierta y cerrada correctamente"
      - uses: actions/upload-artifact@v4
        with:
          name: Dimensionador-${{ runner.os }}
          path: dist/
