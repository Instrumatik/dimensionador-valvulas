# Compila el dimensionador para Windows (.exe), macOS (.app) y Linux en cada etiqueta v*
# o manualmente desde la pestaña Actions. Los ejecutables quedan como artefactos descargables.
name: Compilar ejecutables
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Compilar
        run: python -m PyInstaller --noconfirm dimensionador.spec
      - name: Verificar ejecutable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/N25-Valves-Sizing.app/Contents/MacOS/N25-Valves-Sizing;
          elif [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/N25-Valves-Sizing/N25-Valves-Sizing.exe;
          else EXE=dist/N25-Valves-Sizing/N25-Valves-Sizing; fi
          find dist -path "*plugins/platforms*" -type f
          $EXE --prueba
          # Abre la ventana real (complemento de plataforma de Qt) y la cierra sola
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 >/dev/null; xvfb-run -a $EXE --prueba-gui;
          else $EXE --prueba-gui; fi
          echo "Ventana abierta y cerrada correctamente"
      - uses: actions/upload-artifact@v4
        with:
          name: N25-Valves-Sizing-${{ runner.os }}
          path: dist/
      - name: Compilar el generador de códigos (uso interno, solo Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist_generador --workpath build_generador generador.spec
          EXE=dist_generador/Generador-codigos-N25/Generador-codigos-N25.exe
          ls -la "$EXE"
          set +e
          "$EXE" --prueba-gui
          code=$?
          set -e
          echo "Código de salida del generador: $code"
          if [ $code -ne 0 ]; then
            AV=$(powershell -NoProfile -Command "(Get-MpThreat | ForEach-Object { \$_.ThreatName }) -join ', '; (Get-MpThreatDetection | ForEach-Object { \$_.Resources }) -join ' | '" | tr '\r\n' '  ')
            echo "::warning::El generador no abrió (código $code). Antivirus del runner: ${AV:-sin detecciones}"
            exit $code
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Generador-codigos-N25-Windows
          path: dist_generador/

  # Un solo paquete con los programas, el generador de códigos y el kit de validación
  paquete:
    needs: compilar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Armar el paquete
        run: |
          VER=$(grep -oP '__version__ = "\K[^"]+' dimensionador/__init__.py)
          P="N25-Valves-Sizing-v$VER"
          mkdir -p "$P/1_Programa" "$P/2_Generador_de_codigos_USO_INTERNO" "$P/3_Kit_de_validacion"
          for so in Windows macOS Linux; do
            (cd "artefactos/N25-Valves-Sizing-$so" && zip -qry "../../$P/1_Programa/N25-Valves-Sizing-$so.zip" .)
          done
          (cd artefactos/Generador-codigos-N25-Windows && zip -qry "../../$P/2_Generador_de_codigos_USO_INTERNO/Generador-codigos-N25-Windows.zip" .)
          cp -r kit_validacion/* "$P/3_Kit_de_validacion/"
          cp README.md "$P/LEEME_tecnico.md"
          cp distribucion/LEEME.txt "$P/LEEME.txt"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "P=$P" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Paquete-completo-${{ env.P }}
          path: ${{ env.P }}/
      # Paquete para asistentes: sin el generador de códigos
      - name: Armar el paquete del workshop
        run: |
          WS="$P-Workshop"
          mkdir -p "$WS/2_Kit_del_workshop"
          cp -r "$P/1_Programa" "$WS/"
          cp -r "$P/3_Kit_de_validacion" "$WS/"
          cp -r kit_workshop/* "$WS/2_Kit_del_workshop/"
          cp distribucion/LEEME_workshop.txt "$WS/LEEME.txt"
          test ! -e "$WS/2_Generador_de_codigos_USO_INTERNO"
          echo "WS=$WS" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WS }}
          path: ${{ env.WS }}/
